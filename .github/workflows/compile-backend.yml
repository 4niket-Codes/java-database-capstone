name: Compile Java Backend

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  compile:
    name: Build and Test Spring Boot Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x app/mvnw

      - name: Compile Java backend
        run: cd app && ./mvnw clean compile -DskipTests

      - name: Run unit tests
        run: cd app && ./mvnw test

      - name: Package application JAR
        run: cd app && ./mvnw package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: app/target/*.jar
          retention-days: 7
